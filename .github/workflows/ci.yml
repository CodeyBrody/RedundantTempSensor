name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify CMake installation
        run: cmake --version

      - name: Configure Unity tests
        run: cmake -S tests -B tests/build/ci -G Ninja

      - name: Build Unity tests
        run: cmake --build tests/build/ci

      - name: Run Unity tests
        run: ctest --test-dir tests/build/ci --output-on-failure

  firmware-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build

      - name: Verify ARM cross-compiler
        run: arm-none-eabi-gcc --version

      - name: Configure Debug firmware
        run: cmake --preset Debug

      - name: Build Debug firmware
        run: cmake --build --preset Debug

      - name: Configure Release firmware
        run: cmake --preset Release

      - name: Build Release firmware
        run: cmake --build --preset Release
